vault:
  path: "E:/obsidian_vault/政治经济知识库"

schedule:
  time: "05:00"
  timezone: "Asia/Shanghai"

llm:
  provider: "deepseek"
  fast_model: "deepseek-chat"
  smart_model: "deepseek-chat"

mineru:
  model: "vlm"
  poll_interval: 5
  max_wait: 300

cleaner:
  engine: "markitdown"

filter:
  quality_threshold: 5
  highlight_threshold: 8

collectors:
  domestic_official:
    peopledaily:
      enabled: true
      rss_url: "http://www.people.com.cn/rss/politics.xml"
    state_council:
      enabled: false
      url: "https://www.gov.cn/"
    pbc:
      enabled: false
      url: "http://www.pbc.gov.cn/"
  international_finance:
    cnbc:
      enabled: true
      feeds:
        - top
        - economy
    marketwatch:
      enabled: true
    ftchinese:
      enabled: true
    projectsyndicate:
      enabled: true
  academic:
    nber:
      enabled: true
    cfr:
      enabled: true
    csis:
      enabled: true
  social_media:
    hackernews:
      enabled: true
    arxiv:
      enabled: true
      query: "cat:q-fin.*"
      max_results: 25

output:
  daily_brief: true
  single_articles: true
  topic_aggregation:
    enabled: true
    min_articles: 5
